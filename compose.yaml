name: pbp-monitoring

services:
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OUTPUT_DIR: /data
      SYSLOG_HOST: 0.0.0.0
      SYSLOG_PORT: "5514"
      PBP_CONFIG_DB: /config/config.db
    volumes:
      - pbp-data:/data
      - pbp-config:/config
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  syslog-gateway:
    build:
      context: .
      dockerfile: docker/syslog-gateway.Dockerfile
    depends_on:
      collector:
        condition: service_healthy
    ports:
      - target: 1514
        published: "514"
        protocol: udp
      - target: 1514
        published: "514"
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  webui:
    image: pbp-monitoring-collector
    depends_on:
      collector:
        condition: service_healthy
    command: ["pbp-web", "--data-dir", "/data", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      WEB_LOG_FRESH_SECONDS: "300"
      PBP_CONFIG_DB: /config/config.db
      WEB_TLS_HOSTNAMES: ${WEB_TLS_HOSTNAMES:-localhost,127.0.0.1}
      WEB_TLS_CERT: ${WEB_TLS_CERT:-}
      WEB_TLS_KEY: ${WEB_TLS_KEY:-}
      WEB_HTTPS_PUBLIC_PORT: ${WEB_PORT:-8088}
    volumes:
      - pbp-data:/data:ro
      - pbp-config:/config
      - ./certs:/certs:ro
    ports:
      - "${WEB_PORT:-8088}:8080/tcp"
      - "${WEB_HTTP_PORT:-80}:8081/tcp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8080/healthz', timeout=2, context=ssl._create_unverified_context()).read()"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pbp-data:
    name: pbp-monitoring-data
  pbp-config:
    name: pbp-monitoring-config
