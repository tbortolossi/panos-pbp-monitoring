name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --editable .
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Compile Python sources
        run: python -m compileall -q src/pbp_monitoring tools
      - name: Build the documentation demo pages
        # No pixel comparison: headless rendering differs between the
        # maintainer's Debian and ubuntu-latest, so only the generator is
        # exercised. The images themselves are regenerated and reviewed by hand.
        run: python tools/generate_demo_stack.py --check
      - name: Validate Compose configuration
        run: docker compose config --quiet
