[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "panos-pbp-monitoring"
version = "0.29.0"
description = "Read-only, event-driven diagnostic collector for Palo Alto Networks PAN-OS Packet Buffer Protection incidents"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = [
    "pan-os", "palo-alto-networks", "panorama", "packet-buffer-protection",
    "packet-buffer", "dos-protection", "firewall", "syslog", "xml-api",
    "network-diagnostics", "incident-response", "docker-compose",
]
dependencies = ["cryptography>=50.0.1,<51"]

[project.urls]
Homepage = "https://github.com/tbortolossi/panos-pbp-monitoring"
Documentation = "https://github.com/tbortolossi/panos-pbp-monitoring#readme"
Issues = "https://github.com/tbortolossi/panos-pbp-monitoring/issues"
Security = "https://github.com/tbortolossi/panos-pbp-monitoring/security/policy"

[project.scripts]
pbp-orchestrator = "pbp_monitoring.orchestrator:main"
pbp-report = "pbp_monitoring.reporting:main"
pbp-export-text = "pbp_monitoring.text_export:main"
pbp-web = "pbp_monitoring.webui:main"
pbp-config = "pbp_monitoring.config_cli:main"
pbp-support = "pbp_monitoring.diagnostics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
